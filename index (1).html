<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A3FBF">
<title>Obour Branch Booking</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Obour Booking">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky service-desk bar → week ribbon showing each day's load against capacity → status strip that doubles as the filter → job list (table on desktop, tickets on phone) → side sheet for one booking with its actions and log */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --sunk:#E5E8ED;
  --ink:#14161B; --ink-2:#434955; --muted:#6F7581; --line:#DCDFE5; --line-2:#C4C9D2;
  --accent:#2A3FBF; --accent-hover:#21329C; --accent-ink:#FFFFFF; --accent-soft:#E3E7F8;
  --danger:#B3263D; --danger-soft:#F8E1E5; --ok:#2B7A3A; --ok-soft:#DFF0E2; --amber:#8F5C00; --amber-soft:#F6EACB;
  --s-booked:#33479E; --s-booked-bg:#E3E7F6;
  --s-postponed:#AE4C14; --s-postponed-bg:#F8E3D5;
  --s-received:#0A747A; --s-received-bg:#D9EFEF;
  --s-ready:#8F5C00; --s-ready-bg:#F6EACB;
  --s-delivered:#2B7A3A; --s-delivered-bg:#DFF0E2;
  --s-noshow:#B3263D; --s-noshow-bg:#F8E1E5;
  --s-cancelled:#646A75; --s-cancelled-bg:#E6E8EC;
  --s-confirmed:#5A3FB0; --s-confirmed-bg:#ECE7F8;
  --s-arrived:#0B6596; --s-arrived-bg:#DDEDF7;
  --wa:#12804A; --wa-ink:#FFFFFF;
  --series-1:#2a78d6; --c-del:#1baf7a; --c-in:#eda100; --c-up:#2a78d6; --c-ns:#eb6834; --c-off:#6250d6;
  --scrim:rgba(17,19,24,.45);
  --shadow-1:0 1px 2px rgba(17,19,24,.06);
  --shadow-2:0 24px 60px rgba(17,19,24,.22);
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#171A20; --surface-2:#1C2027; --sunk:#252A33;
  --ink:#ECEEF2; --ink-2:#B9BEC8; --muted:#8A909C; --line:#2A2F38; --line-2:#3B414C;
  --accent:#93A2FF; --accent-hover:#AEB9FF; --accent-ink:#0D1233; --accent-soft:#232A4D;
  --danger:#FF8C9D; --danger-soft:#3B1E26; --ok:#80D18D; --ok-soft:#1D3322; --amber:#E8B957; --amber-soft:#3A2F17;
  --s-booked:#AAB6F3; --s-booked-bg:#252C4A;
  --s-postponed:#F4A16C; --s-postponed-bg:#3D2617;
  --s-received:#6ED2D5; --s-received-bg:#133536;
  --s-ready:#E8B957; --s-ready-bg:#3A2F17;
  --s-delivered:#80D18D; --s-delivered-bg:#1D3322;
  --s-noshow:#FF8C9D; --s-noshow-bg:#3B1E26;
  --s-cancelled:#A3A8B2; --s-cancelled-bg:#2A2E35;
  --s-confirmed:#C2B1F6; --s-confirmed-bg:#2D2548;
  --s-arrived:#7CC6EC; --s-arrived-bg:#14303F;
  --wa:#43C97F; --wa-ink:#062313;
  --series-1:#3987e5; --c-del:#199e70; --c-in:#c98500; --c-up:#3987e5; --c-ns:#d95926; --c-off:#9085e9;
  --scrim:rgba(0,0,0,.6); --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#171A20; --surface-2:#1C2027; --sunk:#252A33;
  --ink:#ECEEF2; --ink-2:#B9BEC8; --muted:#8A909C; --line:#2A2F38; --line-2:#3B414C;
  --accent:#93A2FF; --accent-hover:#AEB9FF; --accent-ink:#0D1233; --accent-soft:#232A4D;
  --danger:#FF8C9D; --danger-soft:#3B1E26; --ok:#80D18D; --ok-soft:#1D3322; --amber:#E8B957; --amber-soft:#3A2F17;
  --s-booked:#AAB6F3; --s-booked-bg:#252C4A;
  --s-postponed:#F4A16C; --s-postponed-bg:#3D2617;
  --s-received:#6ED2D5; --s-received-bg:#133536;
  --s-ready:#E8B957; --s-ready-bg:#3A2F17;
  --s-delivered:#80D18D; --s-delivered-bg:#1D3322;
  --s-noshow:#FF8C9D; --s-noshow-bg:#3B1E26;
  --s-cancelled:#A3A8B2; --s-cancelled-bg:#2A2E35;
  --s-confirmed:#C2B1F6; --s-confirmed-bg:#2D2548;
  --s-arrived:#7CC6EC; --s-arrived-bg:#14303F;
  --wa:#43C97F; --wa-ink:#062313;
  --series-1:#3987e5; --c-del:#199e70; --c-in:#c98500; --c-up:#3987e5; --c-ns:#d95926; --c-off:#9085e9;
  --scrim:rgba(0,0,0,.6); --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.01em;direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{width:18px;height:18px;flex:none}

/* ---------- bars & wrappers ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:44px;height:46px;border-radius:var(--r-sm);border:1.5px solid var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;flex:none;background:var(--surface)}
.mark span{background:var(--ink);color:var(--surface);font-size:10px;font-weight:600;text-align:center;line-height:16px}
.mark b{font-family:var(--f-display);font-size:19px;display:grid;place-items:center;line-height:1;font-variant-numeric:tabular-nums}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.3;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;max-width:100%}
.user-chip .who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.user-chip .who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.user-chip .who small{color:var(--muted);font-size:11.5px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk)}
.av.sm{width:22px;height:22px}

.wrap{padding-block:18px 64px;display:grid;gap:16px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--surface)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.mfg{color:var(--amber);border-color:var(--amber-soft);background:var(--amber-soft)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}
.btn.icon{padding:0;width:38px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12.5px}
.link:hover{text-decoration:underline}

/* ---------- banners ---------- */
#banner:empty{display:none}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.banner.warn{background:var(--amber-soft)}
.banner.bad{background:var(--danger-soft)}
.banner b{font-weight:600}

/* ---------- date bar ---------- */
.datebar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 20px;align-items:center}
.date-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.date-title{display:flex;flex-direction:column;line-height:1.2;min-width:118px;text-align:center}
.date-title span{color:var(--muted);font-size:12.5px}
.date-title strong{font-family:var(--f-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.date-pick input{height:34px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 8px;font-size:13px}
.ribbon{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:7px 8px 8px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);text-align:start;min-width:0;position:relative}
.day:hover{border-color:var(--line-2)}
.day .dn{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .dd{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}
.day .load{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.day .load i{display:block;height:100%;background:var(--accent);border-radius:2px}
.day.full .load i{background:var(--amber)}
.day.over .load i{background:var(--danger)}
.day .cnt.full{color:var(--amber);font-weight:600}
.day.over .cnt.full{color:var(--danger)}
.day .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.today .dn::after{content:" · اليوم";color:var(--accent);font-weight:600}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.day.sel .dn,.day.sel .cnt{color:var(--surface);opacity:.75}
.day.sel.today .dn::after{color:var(--surface)}
.day.sel .load{background:color-mix(in srgb,var(--surface) 25%,transparent)}
.day.sel .load i{background:var(--surface)}
.day.sel.full .load i{background:var(--amber-soft)}
.day.sel .cnt.full{color:var(--surface);opacity:1}
.day.sel.over .load i{background:var(--s-noshow-bg)}

/* ---------- status strip ---------- */
.stats{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px}
.stat{display:flex;align-items:baseline;gap:8px;padding:8px 12px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;text-align:start}
.stat:hover{background:var(--surface)}
.stat b{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.stat span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--ink-2))}
.stat.on{background:var(--surface);border-color:var(--ink);box-shadow:var(--shadow-1)}
.stat[data-k="all"] span::before{display:none}
.stat[data-k="mfg"] b{color:var(--amber)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{white-space:nowrap;flex:none;border:0;background:transparent;padding:6px 12px;border-radius:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1 1 360px;justify-content:flex-end;min-width:0}
.search{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);flex:1 1 240px;max-width:380px;min-width:0;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink);min-width:0}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tools select{height:38px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 10px;max-width:200px}

/* ---------- list ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.thead,.row{display:grid;grid-template-columns:76px minmax(150px,1.3fr) minmax(150px,1.25fr) 132px 140px 150px 136px;gap:12px;align-items:center;padding-inline:16px}
.thead{padding-block:9px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.row{padding-block:11px;border-bottom:1px solid var(--line);cursor:pointer;outline-offset:-2px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.dim{opacity:.62}
.row.dim:hover{opacity:1}
.grp{padding:10px 16px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.grp b{font-weight:600;color:var(--ink)}
.grp span{color:var(--muted)}
.c-time{display:flex;align-items:baseline;gap:3px;font-variant-numeric:tabular-nums}
.c-time b{font-family:var(--f-display);font-weight:600;font-size:16px}
.c-time span{font-size:11.5px;color:var(--muted)}
.c-cust,.c-car,.c-by,.c-st{min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);direction:ltr;unicode-bidi:isolate;display:inline-block}
.car{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-by{display:flex;align-items:center;gap:8px;font-size:13px}
.c-by span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-st{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.c-act{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.quick{min-width:56px}
.quick.alt{color:var(--s-postponed)}

.pill{--c:var(--s-booked);--cb:var(--s-booked-bg);display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:var(--cb);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill[data-s="postponed"]{--c:var(--s-postponed);--cb:var(--s-postponed-bg)}
.pill[data-s="received"]{--c:var(--s-received);--cb:var(--s-received-bg)}
.pill[data-s="ready"]{--c:var(--s-ready);--cb:var(--s-ready-bg)}
.pill[data-s="delivered"]{--c:var(--s-delivered);--cb:var(--s-delivered-bg)}
.pill[data-s="noshow"]{--c:var(--s-noshow);--cb:var(--s-noshow-bg)}
.pill[data-s="cancelled"]{--c:var(--s-cancelled);--cb:var(--s-cancelled-bg)}
.pill[data-s="confirmed"]{--c:var(--s-confirmed);--cb:var(--s-confirmed-bg)}
.pill[data-s="arrived"]{--c:var(--s-arrived);--cb:var(--s-arrived-bg)}
.flag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.flag.warn{color:var(--amber)}
.flag.bad{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip.wait{color:var(--amber);background:var(--amber-soft)}
.chip.na{color:var(--muted);font-weight:500;padding-inline:0}

.empty{padding:48px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.loading-row{padding:28px 16px;color:var(--muted);text-align:center}
.list-note{padding:8px 16px;font-size:12px;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}

/* ---------- overlay: drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(540px,100%);background:var(--surface);z-index:51;overflow-y:auto;box-shadow:var(--shadow-2);
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;display:flex;flex-direction:column;gap:16px}
@media (max-width:540px){.drawer{padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}}
.dw-head{display:flex;align-items:center;gap:10px}
.dw-head .code{color:var(--muted);font-size:12.5px}
.dw-head .sp{flex:1}
.dw-title h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.3;text-wrap:balance}
.dw-title p{margin:4px 0 0;color:var(--ink-2)}
.dw-title .flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dw-actions{display:flex;flex-wrap:wrap;gap:8px}
.panel{border:1px solid var(--line-2);border-radius:var(--r-md);padding:14px;display:grid;gap:12px;background:var(--surface-2)}
.panel h4{margin:0;font-size:14px;font-weight:600}
.panel .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel .btns{display:flex;gap:8px;flex-wrap:wrap}
.facts{margin:0;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.facts > div{padding:11px 0;border-bottom:1px solid var(--line);min-width:0;padding-inline-end:12px}
.facts > div.full{grid-column:1/-1}
.facts dt{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;margin-bottom:3px}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts dd .plan{display:block}
.facts dd .act{display:block;font-size:12.5px;color:var(--ink-2)}
.facts dd .act.late{color:var(--danger)}
.sec-h{margin:4px 0 0;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.hist li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.hist li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line-2);margin-top:6px;justify-self:center;position:relative;z-index:1}
.hist li::after{content:"";position:absolute;top:16px;bottom:0;inset-inline-start:6px;width:1px;background:var(--line)}
.hist li:last-child::after{display:none}
.hist li[data-t="received"]::before{background:var(--s-received)}
.hist li[data-t="delivered"]::before{background:var(--s-delivered)}
.hist li[data-t="postponed"]::before{background:var(--s-postponed)}
.hist li[data-t="noshow"]::before,.hist li[data-t="cancelled"]::before{background:var(--s-noshow)}
.hist li[data-t="mfg_on"]::before{background:var(--amber)}
.hist li[data-t="confirmed"]::before{background:var(--s-confirmed)}
.hist li[data-t="arrived"]::before{background:var(--s-arrived)}
.hist li[data-t="wa"]::before{background:var(--wa)}
.hist .h-t{font-weight:600;font-size:13.5px}
.hist .h-m{font-size:12px;color:var(--muted)}
.hist .h-n{font-size:13px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.others{display:grid;gap:4px}
.others button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;text-align:start}
.others button:hover{border-color:var(--line-2)}
.dw-foot{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-sm);background:var(--danger-soft);font-size:13px;width:100%}

.modal{position:fixed;z-index:51;top:50%;left:50%;transform:translate(-50%,-50%);width:min(780px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-2);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:640px){.modal{inset:0;transform:none;width:100%;max-height:none;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.m-body{padding:18px 20px;overflow-y:auto;flex:1;min-height:0}
.m-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.m-foot .sp{flex:1}
@media (max-width:640px){.m-head,.m-body,.m-foot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:grid;gap:5px;min-width:0;align-content:start}
.f.full{grid-column:1/-1}
.f > label,.f > .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f .req{color:var(--danger)}
.f input[type="text"],.f input[type="tel"],.f input[type="number"],.f input[type="date"],.f input[type="time"],.f input[type="datetime-local"],.f input[type="search"],.f select,.f textarea,
.panel input,.panel select,.panel textarea{width:100%;min-height:40px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:7px 10px;font-size:14px}
.f textarea,.panel textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.panel input:focus,.panel textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f .hint{font-size:12px;color:var(--muted)}
.f .hint.warn{color:var(--amber)}
.f .hint.bad{color:var(--danger)}
.pair{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.form-err{grid-column:1/-1;margin:0;padding:8px 12px;border-radius:var(--r-sm);background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:600}
input[dir="ltr"]{text-align:right}

/* ---------- settings ---------- */
.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.set-sec{display:grid;gap:12px}
.set-sec > p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lrow input[type="text"],.lrow select{min-height:38px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:6px 10px;width:100%}
.lrow.fld{grid-template-columns:minmax(0,1.3fr) 130px minmax(0,1.2fr) auto auto}
.lrow.typ{grid-template-columns:minmax(0,1fr) 190px auto auto}
@media (max-width:640px){.lrow.typ{grid-template-columns:minmax(0,1fr) auto}.lrow.typ input[type="text"]{grid-column:1;grid-row:1}.lrow.typ .btn{grid-column:2;grid-row:1}.lrow.typ select{grid-column:1/-1;grid-row:2}.lrow.typ .check{grid-column:1/-1;grid-row:3;min-height:30px}}
.lrow .lim{font-size:13px;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:8px}
.lrow .lim input{width:72px;min-height:38px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:6px 8px;text-align:center}
@media (max-width:640px){.lrow.fld{grid-template-columns:1fr 1fr}.lrow.fld .opt{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--sunk);font-size:13px}
.chips button{border:0;background:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chips button:hover{background:var(--line)}
.chips svg{width:12px;height:12px}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-height:38px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:6px 10px;min-width:0}
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.matrix{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.matrix thead th{background:var(--surface-2);font-weight:600;color:var(--ink-2);line-height:1.35}
.matrix th:first-child,.matrix td:first-child{text-align:start;position:sticky;right:0;background:var(--surface);min-width:150px}
.matrix thead th:first-child{background:var(--surface-2)}
.matrix tr:last-child td{border-bottom:0}
.matrix td input[type="text"]{width:100%;min-height:34px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:4px 8px}
.matrix input[type="checkbox"]{width:17px;height:17px;accent-color:var(--accent)}
.urow{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.urow .who{display:flex;align-items:center;gap:8px;min-width:0}
.urow .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow select{min-height:36px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:4px 8px;width:100%}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--ink-2);font-weight:600}
@media (max-width:540px){.urow{grid-template-columns:1fr auto}.urow select{grid-column:1/-1;grid-row:2}}

/* ---------- view nav ---------- */
.nav-in{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:4px;margin-top:-4px}
.nav-in button{display:inline-flex;align-items:center;gap:7px;padding:8px 12px 10px;border:0;background:none;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent}
.nav-in button:hover{color:var(--ink)}
.nav-in button.on{color:var(--ink);border-bottom-color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger-soft);color:var(--danger);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
#viewBookings{display:grid;gap:16px}

/* ---------- multi-select ---------- */
.ms{position:relative}
.ms-btn{width:100%;min-height:40px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:5px 10px 5px 32px;text-align:start;position:relative;font-size:14px}
.ms-btn::after{content:"";position:absolute;left:13px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.ms-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ms-btn .ph-txt{color:var(--muted)}
.ms-tag{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:12.5px;font-weight:600}
.ms-pop{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);box-shadow:var(--shadow-2);padding:6px;display:grid;gap:2px;max-height:260px;overflow:auto}
.ms-pop label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;font-size:14px;cursor:pointer}
.ms-gh{font-size:11.5px;font-weight:600;color:var(--muted);padding:10px 10px 2px;letter-spacing:.02em;border-top:1px solid var(--line);margin-top:2px}
.ms-pop > .ms-gh:first-child{border-top:0;margin-top:0;padding-top:4px}
.ms-rest{display:grid;gap:2px}
.ms-more{border:0;border-top:1px solid var(--line);background:none;color:var(--accent);font-weight:600;font-size:13px;padding:10px;text-align:start;margin-top:2px}
.ms-more:hover{text-decoration:underline}
.ms-pop label:hover{background:var(--surface-2)}
.ms-pop input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.ms-pop .cap{margin-inline-start:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ms-pop .cap.full{color:var(--danger);font-weight:600}
.ms.bad .ms-btn{border-color:var(--danger)}
.approve-box{grid-column:1/-1;padding:10px 12px;border-radius:var(--r-sm);background:var(--amber-soft);color:var(--ink);font-size:13px;display:grid;gap:3px}
.approve-box b{font-weight:600;color:var(--amber)}

/* ---------- department dashboard ---------- */
.dash{display:grid;gap:16px}
.dash-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.dash-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px}
.dash-head p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:64ch}
.dash-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dash-range{font-weight:600;font-size:13.5px;min-width:128px;text-align:center;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:4px;align-content:start;min-width:0}
.kpi b{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi b.txt{font-size:18px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.kpi.warn b{color:var(--amber)}
.kpi.bad b{color:var(--danger)}
.heat-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow-x:auto}
.heat{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.heat th,.heat td{padding:4px;border-bottom:1px solid var(--line);text-align:center}
.heat tbody tr:last-child th,.heat tbody tr:last-child td{border-bottom:0}
.heat thead th{padding:8px 4px;background:var(--surface-2);font-weight:600;color:var(--muted);min-width:58px}
.heat thead th span{display:block;font-size:11px;white-space:nowrap}
.heat thead th b{display:block;font-family:var(--f-display);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.heat thead th.today b{color:var(--accent)}
.heat th:first-child{position:sticky;right:0;z-index:1;background:var(--surface);text-align:start;padding-inline:14px 10px;min-width:148px;border-left:1px solid var(--line)}
.heat thead th:first-child{background:var(--surface-2)}
.heat tbody th span{display:block;font-weight:600;color:var(--ink)}
.heat tbody th small{color:var(--muted);font-size:11.5px;font-weight:500}
.hc{width:100%;min-height:52px;border:0;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:color-mix(in srgb,var(--accent) var(--mix,0%),var(--surface));color:var(--ink);font-variant-numeric:tabular-nums;padding:4px 2px}
.hc:hover{outline:1.5px solid var(--ink-2);outline-offset:-1.5px}
.hc b{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.1}
.hc.zero b{color:var(--line-2)}
.hc i{font-style:normal;font-size:10.5px;font-weight:700;white-space:nowrap}
.hc em{font-style:normal;font-size:10px;font-weight:600;color:var(--danger);white-space:nowrap}
.hc.full{background:var(--amber-soft);color:var(--amber)}
.hc.over{background:var(--danger-soft);color:var(--danger)}
.hc.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:3px;display:inline-block}
.lg.some{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:1px solid var(--line)}
.lg.full{background:var(--amber-soft);border:1px solid var(--amber)}
.lg.over{background:var(--danger-soft);border:1px solid var(--danger)}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-width:0}
.card h3{margin:0;padding:12px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;background:var(--surface-2)}
.card h3 span{font-variant-numeric:tabular-nums;color:var(--muted)}
.card-empty{margin:0;padding:22px 16px;color:var(--muted);font-size:13px;text-align:center}
.fd{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:start}

.fd-d{display:flex;flex-direction:column;line-height:1.3}

.ap-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;padding:0;text-align:start}

@media (max-width:860px){.dash-cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

.card-b{padding:14px 16px}
.card h3 .hint{font-weight:500}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);padding:12px 16px 0}

.btn.wa{color:var(--wa)}
.btn.wa-go{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn.wa-go:hover{background:var(--wa);border-color:var(--wa);filter:brightness(1.08)}
.phl{display:flex;align-items:center;gap:6px}
.wa-ic{width:26px;height:26px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--wa);display:inline-grid;place-items:center;flex:none}
.wa-ic:hover{border-color:var(--wa)}
.wa-ic svg{width:15px;height:15px}
.tpls{display:flex;flex-wrap:wrap;gap:6px}
.tpl{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tpl.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.panel textarea#waText{min-height:120px;line-height:1.7}
.tpl-row{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.tpl-top{display:flex;gap:8px;align-items:center}
.tpl-top input{flex:1;min-height:38px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:6px 10px;min-width:0;font-weight:600}
.tpl-row textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:8px 10px;resize:vertical;min-height:78px;line-height:1.7}
.ph-keys span{padding:3px 10px;font-size:12.5px}

/* ---------- files ---------- */
.files{display:grid;gap:6px;margin-top:4px}
.file{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-width:0}
.thumb{width:48px;height:48px;padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--sunk);flex:none;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ficon{width:48px;height:48px;border-radius:4px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;font-family:var(--f-mono)}
.fmeta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.fmeta b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta small{color:var(--muted);font-size:11.5px}
.fact{display:flex;gap:10px;flex:none;align-items:center}
.fact a{color:var(--accent);font-weight:600;font-size:12.5px;text-decoration:none}
.fact a:hover{text-decoration:underline}
.link.danger{color:var(--danger)}
.f input[type="file"],.panel input[type="file"]{font-size:13px;padding:8px;border:1px dashed var(--line-2);border-radius:var(--r-sm);background:var(--surface);width:100%;min-height:0}
.panel input[type="radio"],.panel input[type="checkbox"]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--accent)}
.radios{display:flex;flex-wrap:wrap;gap:2px 18px}
.lightbox{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 56px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:var(--r-sm);box-shadow:var(--shadow-2);background:var(--surface)}
.lightbox .btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px))}
.set-sub{display:grid;gap:10px;padding-top:16px;margin-top:4px;border-top:1px solid var(--line)}
.set-sub h4{margin:0;font-size:14px;font-weight:600}
.set-sub > p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}

/* ---------- toasts ---------- */
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:8px;width:min(460px,calc(100% - 32px))}
.toast{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--ink);color:var(--surface);box-shadow:var(--shadow-2);font-size:13.5px}
.toast.err{background:var(--danger);color:var(--surface)}
.toast span{flex:1}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}

/* ---------- responsive ---------- */
@media (max-width:1060px){
  .thead,.row{grid-template-columns:70px minmax(140px,1.3fr) minmax(130px,1.2fr) 124px 140px 128px}
  .c-by,.thead .h-by{display:none}
}
@media (max-width:820px){
  .datebar{grid-template-columns:1fr}
  .date-nav{justify-content:space-between}
  .thead{display:none}
  .row{grid-template-columns:58px minmax(0,1fr) auto;grid-template-areas:"time cust st" "time car car" "time mfg act";gap:6px 12px;align-items:start;padding-block:12px}
  .c-time{grid-area:time;flex-direction:column;align-items:flex-start;gap:0}
  .c-cust{grid-area:cust}.c-car{grid-area:car}.c-mfg{grid-area:mfg;align-self:center}.c-st{grid-area:st;justify-content:flex-end}.c-act{grid-area:act}
  .grp{padding-inline:16px}
}
@media (max-width:640px){
  .form-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
  .panel .row2{grid-template-columns:1fr}
  .tools{flex-basis:100%}
  .search{max-width:none}
  .top-actions{width:100%}
  .top-actions .user-chip{flex:1;min-width:0}
  #btnSettings span{display:none}
  .stats{flex-wrap:nowrap;overflow-x:auto;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
  .stat{flex:none}
  .ribbon{gap:4px}
  .day{padding:6px 5px 7px}
  .day.today .dn::after{content:""}
  .day.today{box-shadow:inset 0 -2px 0 var(--accent)}
  .day.sel.today{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- sign-in gate ---------- */
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 24px;display:grid;gap:16px;text-align:center;box-shadow:var(--shadow-1)}
.gate-card h1{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600}
.gate [data-g]{display:grid;gap:14px;justify-items:center}
.gate [data-g][hidden]{display:none!important}
.gate p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.75}
.gate .g-email{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;color:var(--ink)}
.gate .btn{min-width:200px}
</style>

document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const todayStr=()=>ymd(new Date());
const LOC='ar-EG-u-nu-latn';
const fDay=new Intl.DateTimeFormat(LOC,{weekday:'long'});
const fDM=new Intl.DateTimeFormat(LOC,{day:'numeric',month:'long'});
const fMonth=new Intl.DateTimeFormat(LOC,{month:'long'});
const fFull=new Intl.DateTimeFormat(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const dayName=s=>fDay.format(parseYmd(s));
const dm=s=>fDM.format(parseYmd(s));
function splitTime(hhmm){if(!hhmm)return null;const p=hhmm.split(':').map(Number);return {t:(p[0]%12||12)+':'+pad(p[1]),ap:p[0]<12?'ص':'م'};}
function fmtTime(hhmm){const s=splitTime(hhmm);return s?s.t+' '+s.ap:'';}
function hhmmOf(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtStamp(iso){if(!iso)return '';const d=new Date(iso);return dayName(ymd(d))+' '+fDM.format(d)+' · '+fmtTime(hhmmOf(d));}
function nowLocal(){const d=new Date();return ymd(d)+'T'+hhmmOf(d);}
function weekStart(s){const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+1)%7));return ymd(d);}
const rid=(p)=>p+Math.random().toString(36).slice(2,8);
function makeCode(date){const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<3;i++)r+=c[Math.floor(Math.random()*c.length)];return String(date||todayStr()).slice(5).replace('-','')+'-'+r;}
function norm(s){return String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\s+/g,' ').trim();}
function normPhone(s){return String(s||'').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[^\d+]/g,'');}

const IC={
  check:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock:'<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M10 6.5V10l2.5 1.5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>',

};

/* ================= model ================= */
const PERMS=[

  ['editAll','تعديل أي حجز'],
  ['editOwn','تعديل حجوزاته فقط'],

const allPerms=()=>Object.fromEntries(PERMS.map(p=>[p[0],true]));
const DEFAULT_CONFIG={
  branchName:'',
  receiveFlow:{workOrderField:'',reportField:'',requireReport:false},
  waTemplates:[
    {id:'confirm',name:'تأكيد الحجز',text:'أهلًا أ/ {الاسم}،\nتم تأكيد حجزك في {الفرع} يوم {اليوم} {التاريخ} الساعة {الوقت}.\nالسيارة: {السيارة}\nالخدمة: {نوع_الحجز}\nرقم الحجز: {رقم_الحجز}\nفي انتظارك.'},

  ],

  departments:[
    {id:'upholstery',name:'التنجيد والفرش',limit:4},
    {id:'electronics',name:'الإلكترونيات والصوتيات',limit:4},

    operation:{name:'Operation',perms:{status:true,mfg:true}},
    viewer:{name:'متابعة فقط',perms:{}}
  }
};
const STATUS={confirmed:'أكد الحضور',arrived:'وصل العميل',booked:'محجوز',postponed:'مؤجل',received:'تم الاستلام',ready:'جاهزة للتسليم',delivered:'تم التسليم',noshow:'لم يحضر',cancelled:'ملغي'};
const CLOSED=['delivered','noshow','cancelled'];
const GROUPS=[
  {k:'all',label:'الكل',test:()=>true},
  {k:'unconf',label:'لم يؤكد بعد',dot:'var(--s-booked)',test:b=>b.status==='booked'||(b.status==='postponed'&&!b.noDate)},
  {k:'confirmed',label:'أكد الحضور',dot:'var(--s-confirmed)',test:b=>b.status==='confirmed'},
  {k:'arrived',label:'بانتظار أمر الشغل',dot:'var(--s-arrived)',opt:1,test:b=>b.status==='arrived'},
  {k:'inside',label:'داخل الفرع',dot:'var(--s-received)',test:b=>b.status==='received'||b.status==='ready'},
  {k:'delivered',label:'تم التسليم',dot:'var(--s-delivered)',test:b=>b.status==='delivered'},
  {k:'apolog',label:'اعتذر — بدون موعد',dot:'var(--s-postponed)',opt:1,test:b=>b.status==='postponed'&&!!b.noDate},

async function shrink(file){
  const bmp=await createImageBitmap(file);const k=Math.min(1,2400/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
  if(!blob||blob.size>=file.size)return file;
  return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
}

    const ta=a.receiveTime||'99:99',tb=b.receiveTime||'99:99';
    if(ta!==tb)return ta<tb?-1:1;
    return String(a.createdAt||'')<String(b.createdAt||'')?-1:1;
  });
}
function lateFlag(b){
  const now=new Date(),today=todayStr();
  if(b.status==='postponed'&&b.noDate)return {t:'بانتظار موعد جديد',k:'warn'};
  if(b.status==='arrived')return {t:'بانتظار أمر الشغل',k:'warn'};
  if(b.status==='booked'||b.status==='postponed'||b.status==='confirmed'){
    if(b.date<today)return {t:'فات الموعد',k:'bad'};
    if(b.date===today&&b.receiveTime){const p=b.receiveTime.split(':').map(Number);const t=new Date();t.setHours(p[0],p[1]+30,0,0);if(now>t)return {t:'متأخر عن الموعد',k:'warn'};}
  }
  if((b.status==='received'||b.status==='ready')&&b.deliveryDate){
    const d=parseYmd(b.deliveryDate);if(b.deliveryTime){const p=b.deliveryTime.split(':').map(Number);d.setHours(p[0],p[1]);}else d.setHours(23,59);
    if(now>d)return {t:'تأخر التسليم',k:'bad'};
  }
  return null;
}
function nextActions(b){
  if(isPending(b))return can('approve')?[{k:'approve',label:'موافقة'}]:[];
  if(!can('status'))return [];
  const s=b.status;
  if(s==='postponed'&&b.noDate)return [{k:'postpone',label:'موعد جديد',panel:1}];
  if(s==='booked'||s==='postponed')return [{k:'confirm',label:'أكد'},{k:'apolog',label:'اعتذر',panel:1,cls:'alt'}];
  if(s==='confirmed')return [{k:'arrive',label:'وصل'}];
  if(s==='arrived')return [{k:'receive',label:'أمر الشغل',panel:1}];
  if(s==='received')return [{k:'ready',label:'جاهزة'}];
  if(s==='ready')return [{k:'deliver',label:'تسليم'}];
  return [];
}
function mfgChip(b){
  if(b.mfgConfirmed)return `<span class="chip ok">${IC.check}تم التأكيد</span>`;
  if(needsMfg(b))return CLOSED.includes(b.status)?'<span class="chip na">لم يُؤكد</span>':`<span class="chip wait">${IC.clock}بانتظار التأكيد</span>`;
  return '<span class="chip na">لا يحتاج</span>';
}
function dayInfo(d){
  const c=cfg(),bs=allBookings().filter(b=>b.date===d&&counts(b));let ratio=0;const full=[],over=[];
  c.departments.forEach(dp=>{const n=bs.filter(b=>deptsOf(b).includes(dp.id)).length,lim=deptLimit(dp.id);ratio=Math.max(ratio,n/lim);if(n>=lim)full.push(dp.id);if(n>lim)over.push(dp.id);});
  return {n:bs.length,ratio,full,over,pending:bs.filter(isPending).length};
}

async function doAction(id,kind,p){
  p=p||{};const b=findB(id);if(!b||!S.db)return null;
  const nowIso=new Date().toISOString();
  const entry={type:ACT2HIST[kind]||kind,at:nowIso,by:S.me.id||null};
  if(p.note&&p.note.trim())entry.note=p.note.trim();
  const upd={updatedAt:nowIso,updatedBy:S.me.id||null};
  const prev={status:b.status,date:b.date,receiveTime:b.receiveTime||'',deliveryDate:b.deliveryDate||'',deliveryTime:b.deliveryTime||'',actualReceivedAt:b.actualReceivedAt||null,actualDeliveredAt:b.actualDeliveredAt||null,postponeCount:b.postponeCount||0,mfgConfirmed:!!b.mfgConfirmed,mfgBy:b.mfgBy||null,mfgAt:b.mfgAt||null,approval:b.approval||null,approvalBy:b.approvalBy||null,approvalAt:b.approvalAt||null,overDepts:(b.overDepts||[]).slice(),noDate:!!b.noDate,arrivedAt:b.arrivedAt||null,confirmedAt:b.confirmedAt||null,confirmedBy:b.confirmedBy||null,history:(b.history||[]).slice()};
  const ts=v=>{const d=v?new Date(v):new Date();return isNaN(d)?nowIso:d.toISOString();};
  switch(kind){
    case 'receive':{
      const wo=normDigits(p.wo||'').trim(),at=ts(p.time),wf=woField(),rf=rptField(),ext={};
      if(wo){if(wf)ext[wf.id]=wf.type==='number'&&/^[1-9]\d*$/.test(wo)?Number(wo):wo;else upd.workOrder=wo;entry.wo=wo;}
      if(p.uploaded&&p.uploaded.length){const all=getRpt(b).concat(p.uploaded);if(rf)ext[rf.id]=all;else upd.receiptReport=all;entry.files=p.uploaded.length;}
      if(Object.keys(ext).length)upd.extra=ext;
      if(wo){upd.status='received';upd.actualReceivedAt=at;entry.time=at;if(!b.arrivedAt)upd.arrivedAt=at;}
      else{upd.status='arrived';upd.arrivedAt=at;entry.type='arrived';entry.time=at;}
      break;}
    case 'arrive':upd.status='arrived';upd.arrivedAt=nowIso;break;
    case 'confirm':upd.status='confirmed';upd.confirmedAt=nowIso;upd.confirmedBy=S.me.id||null;break;
    case 'attach':{const rf=rptField(),all=getRpt(b).concat(p.uploaded||[]);if(rf)upd.extra={[rf.id]:all};else upd.receiptReport=all;entry.files=(p.uploaded||[]).length;break;}
    case 'ready':upd.status='ready';break;
    case 'deliver':upd.status='delivered';upd.actualDeliveredAt=ts(p.time);entry.time=upd.actualDeliveredAt;break;
    case 'postpone':{
      if(p.noDate){upd.status='postponed';upd.noDate=true;upd.postponeCount=(b.postponeCount||0)+1;entry.from=b.date+(b.receiveTime?' '+b.receiveTime:'');entry.noDate=true;break;}
      const diff=daysBetween(b.date,p.date);upd.status='postponed';upd.noDate=false;upd.date=p.date;upd.receiveTime=p.t||'';
      upd.deliveryDate=b.deliveryDate?addDays(b.deliveryDate,diff):p.date;upd.postponeCount=(b.postponeCount||0)+(b.noDate?0:1);
      entry.from=b.date+(b.receiveTime?' '+b.receiveTime:'');entry.to=p.date+(upd.receiveTime?' '+upd.receiveTime:'');
      if(p.date!==b.date||b.noDate){Object.assign(upd,approvalFor(p.date,deptsOf(b),b.id));if(upd.approval)entry.note=[entry.note,(upd.approval==='pending'?'يحتاج موافقة: ':'تمت الموافقة: ')+upd.overDepts.map(deptName).join('، ')+' ممتلئ'].filter(Boolean).join(' — ');}
      break;}
    case 'noshow':upd.status='noshow';break;
    case 'cancel':upd.status='cancelled';break;
    case 'reopen':upd.status=b.actualReceivedAt?'received':'booked';upd.actualDeliveredAt=null;if(b.status!=='delivered')Object.assign(upd,approvalFor(b.date,deptsOf(b),b.id));break;
    case 'mfg_on':upd.mfgConfirmed=true;upd.mfgBy=S.me.id||null;upd.mfgAt=nowIso;break;
    case 'mfg_off':upd.mfgConfirmed=false;upd.mfgBy=null;upd.mfgAt=null;break;
    case 'approve':upd.approval='approved';upd.approvalBy=S.me.id||null;upd.approvalAt=nowIso;break;
    case 'reject':upd.approval='rejected';upd.status='cancelled';upd.approvalBy=S.me.id||null;upd.approvalAt=nowIso;break;
    case 'note':break;
  }
  upd.history=prev.history.concat([entry]);
  const ok=await write(()=>S.db.doc('bookings/'+id).update(upd));
  if(ok&&b.date&&S.extra[b.date]){delete S.extra[b.date];}
  return ok?prev:null;
}
async function undo(id,prev){
  const ok=await write(()=>S.db.doc('bookings/'+id).update(Object.assign({},prev,{updatedAt:new Date().toISOString(),updatedBy:S.me.id||null})));
  if(ok)toast('تم التراجع');
}

function typePopHTML(depts,checked,extra,showAll){
  const c=cfg();
  const opts=c.bookingTypes.map(t=>({id:t.id,name:t.name,dept:typeDept(t.id)})).concat(extra||[]);
  if(!opts.length)return '<span class="hint" style="padding:8px">لا توجد أنواع. أضفها من الإعدادات.</span>';
  const row=o=>`<label><input type="checkbox" value="${esc(o.id)}" ${checked.includes(o.id)?'checked':''}><span>${esc(o.name)}</span></label>`;
  if(!opts.some(o=>o.dept))return opts.map(row).join('');
  const mk=(id,name)=>({name,items:opts.filter(o=>o.dept===id)});
  const grp=g=>g.items.length?`<div class="ms-gh" role="presentation">${esc(g.name)}</div>${g.items.map(row).join('')}`:'';
  const gen=mk('','عام');

function formOver(b,date,depts,id){
  if(!date||!depts.length)return [];
  const check=b&&b.date===date?depts.filter(x=>!deptsOf(b).includes(x)):depts;
  return overDepts(date,check,id);
}
function updateFormHints(){

  const dh=$('#dateHint');
  if(dh){dh.className='hint';if(d){const parts=depts.map(x=>deptName(x)+' '+deptLoad(d,x,id)+'/'+deptLimit(x));dh.textContent=dayName(d)+(parts.length?' · '+parts.join(' · '):'');}else dh.textContent='';}

  }

async function saveForm(){
  if(!S.db)return;
  const c=cfg(),id=S.ui.form.id,b=id?findB(id):null;
  const val=k=>($('#'+k)?$('#'+k).value:'').trim();
  const types=msValue('msTypes'),depts=msValue('msDepts');
  const data={types,departments:depts,customerName:val('fName'),phone:val('fPhone'),date:val('fDate'),receiveTime:val('fRecv'),deliveryDate:val('fDelDate')||val('fDate'),deliveryTime:val('fDelTime'),carType:val('fCar'),bookedBy:val('fBy')||S.me.id||null,other:($('#fOther').value||'').trim()};
  data.typeNames={};types.forEach(t=>{const x=c.bookingTypes.find(y=>y.id===t);data.typeNames[t]=x?x.name:((b&&b.typeNames&&b.typeNames[t])||'نوع محذوف');});
  data.deptNames={};depts.forEach(d=>{const x=c.departments.find(y=>y.id===d);data.deptNames[d]=x?x.name:((b&&b.deptNames&&b.deptNames[d])||'قسم محذوف');});
  data.typeNeedsMfg=types.some(t=>{const x=c.bookingTypes.find(y=>y.id===t);return !!(x&&x.needsMfg);});
  const missing=[];if(!data.customerName)missing.push('اسم العميل');if(!data.phone)missing.push('رقم التليفون');if(!types.length)missing.push('نوع الحجز');if(!depts.length)missing.push('القسم');if(!data.date)missing.push('التاريخ');
  const err=$('#formErr');
  $('#msTypes').classList.toggle('bad',!types.length);$('#msDepts').classList.toggle('bad',!depts.length);
  if(missing.length){err.textContent='أكمل الخانات المطلوبة: '+missing.join('، ');err.hidden=false;return;}
  if(data.deliveryDate<data.date){err.textContent='تاريخ التسليم لا يمكن أن يكون قبل يوم الحجز.';err.hidden=false;return;}
  err.hidden=true;
  const extra={},filePicks=[];c.customFields.forEach(f=>{const el=$('#cf_'+f.id);if(!el)return;if(f.type==='file'){if(el.files&&el.files.length)filePicks.push([f.id,[...el.files]]);return;}extra[f.id]=f.type==='checkbox'?el.checked:(f.type==='number'&&el.value!==''?Number(el.value):el.value.trim());});
  const wfS=woField();
  if(b&&DONE_RCV.includes(b.status)&&wfS&&$('#cf_'+wfS.id)&&!String(extra[wfS.id]==null?'':extra[wfS.id]).trim()){err.textContent='رقم أمر الشغل مطلوب لأن السيارة تم استلامها.';err.hidden=false;return;}
  if(filePicks.length){
    const sb=$('#fSave');sb.disabled=true;sb.textContent='جارٍ رفع الملفات…';
    try{for(const [fid,files] of filePicks){const upl=await uploadFiles(files);extra[fid]=((b&&b.extra&&Array.isArray(b.extra[fid]))?b.extra[fid]:[]).concat(upl);}}
    catch(e){err.textContent=e.msg||'تعذّر رفع الملفات.';err.hidden=false;sb.disabled=false;sb.textContent=b?'حفظ التعديلات':'حفظ الحجز';return;}
  }
  data.extra=Object.assign({},b&&b.extra||{},extra);
  const nowIso=new Date().toISOString();
  if(can('mfg')&&$('#fMfg')){const m=$('#fMfg').checked;if(!b||m!==!!b.mfgConfirmed){data.mfgConfirmed=m;data.mfgBy=m?S.me.id||null:null;data.mfgAt=m?nowIso:null;}}
  const over=formOver(b,data.date,depts,id);
  let appr=null;
  if(over.length)appr=can('approve')?{approval:'approved',overDepts:over,approvalBy:S.me.id||null,approvalAt:nowIso}:{approval:'pending',overDepts:over,approvalBy:null,approvalAt:null};
  else if(b&&b.date!==data.date&&b.approval)appr={approval:null,overDepts:[],approvalBy:null,approvalAt:null};
  if(appr)Object.assign(data,appr);
  const apprEntry=appr&&appr.approval?{type:appr.approval==='pending'?'approval_req':'approved',at:nowIso,by:S.me.id||null,note:appr.overDepts.map(deptName).join('، ')+' ممتلئ يوم '+dayName(data.date)+' '+dm(data.date)}:null;
  $('#fSave').disabled=true;
  let ok;
  if(b){
    const changed=Object.keys(FIELD_LABELS).filter(k=>k in data&&String(data[k]==null?'':data[k])!==String(b[k]==null?'':b[k])).map(k=>FIELD_LABELS[k]);
    c.customFields.forEach(f=>{if(!(f.id in extra))return;const a=(b.extra||{})[f.id],z=extra[f.id];if(String(a==null?'':a)!==String(z==null?'':z))changed.push(f.label);});
    const hist=(b.history||[]).slice();
    if(changed.length)hist.push({type:'edited',at:nowIso,by:S.me.id||null,fields:changed});
    if('mfgConfirmed' in data)hist.push({type:data.mfgConfirmed?'mfg_on':'mfg_off',at:nowIso,by:S.me.id||null});
    if(apprEntry)hist.push(apprEntry);
    Object.assign(data,{updatedAt:nowIso,updatedBy:S.me.id||null,history:hist});
    ok=await write(()=>S.db.doc('bookings/'+id).update(data));
    if(ok)toast(appr&&appr.approval==='pending'?'تم حفظ التعديلات — الحجز بانتظار الموافقة':'تم حفظ التعديلات');
  }else{
    const doc=Object.assign({code:makeCode(data.date),status:'booked',postponeCount:0,mfgConfirmed:false,mfgBy:null,mfgAt:null,actualReceivedAt:null,actualDeliveredAt:null,approval:null,overDepts:[],approvalBy:null,approvalAt:null},data,{createdAt:nowIso,createdBy:S.me.id||null,updatedAt:nowIso,updatedBy:S.me.id||null,history:[{type:'created',at:nowIso,by:S.me.id||null}]});
    if(doc.mfgConfirmed)doc.history.push({type:'mfg_on',at:nowIso,by:S.me.id||null});
    if(apprEntry)doc.history.push(apprEntry);
    ok=await write(()=>S.db.collection('bookings').doc().set(doc));
    if(ok){toast('تم حفظ الحجز #'+doc.code+(doc.approval==='pending'?' — بانتظار الموافقة':''));if(S.ui.scope==='day'&&S.ui.date!==data.date&&!S.ui.q){S.ui.date=data.date;}}
  }
  if(ok){closeModal();renderAll();}else{const sv=$('#fSave');if(sv)sv.disabled=false;}
}

async function exportCsv(){
  if(!S.dl){toast('التصدير غير متاح في هذا العرض.','err');return;}
  const c=cfg(),g=GROUPS.find(x=>x.k===S.ui.status)||GROUPS[0];
  const rows=sortRows(scopedBase().filter(g.test));
  if(!rows.length){toast('لا توجد حجوزات في العرض الحالي للتصدير.','err');return;}
  const cell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=['رقم الحجز','القسم','نوع الحجز','اسم العميل','رقم التليفون','اليوم','التاريخ','وقت استلام السيارة (المحدد)','وقت الاستلام الفعلي','موعد التسليم (المحدد)','وقت التسليم الفعلي','نوع السيارة','تأكيد طلب التصنيع','القائم بالحجز','الحالة','مرات التأجيل','الموافقة'].concat(c.customFields.map(f=>f.label)).concat(['أخرى']);
  const lines=[head.map(cell).join(',')];
  rows.forEach(b=>{lines.push([b.code,deptNames(b).join('، '),typeNames(b).join('، '),b.customerName,'="'+(b.phone||'')+'"',dayName(b.date),b.date,fmtTime(b.receiveTime),b.actualReceivedAt?fmtStamp(b.actualReceivedAt):'',(b.deliveryDate||'')+(b.deliveryTime?' '+fmtTime(b.deliveryTime):''),b.actualDeliveredAt?fmtStamp(b.actualDeliveredAt):'',b.carType,b.mfgConfirmed?'نعم':(needsMfg(b)?'لم يتم':'لا يحتاج'),nameOf(b.bookedBy),STATUS[b.status]||b.status,b.postponeCount||0,({pending:'بانتظار الموافقة',approved:'تمت الموافقة',rejected:'مرفوض'})[b.approval]||''].concat(c.customFields.map(f=>fmtField(f,b.extra&&b.extra[f.id]))).concat([b.other]).map(cell).join(','));});
  const label=S.ui.q?'search':S.ui.scope==='day'?S.ui.date:S.ui.scope==='week'?'week-'+weekStart(S.ui.date):'all';
  try{await S.dl.save({filename:'bookings-'+label+'.csv',data:'﻿'+lines.join('\r\n')});toast('تم التصدير');}
  catch(e){if(e&&e.code==='declined')return;if(e&&(e.code==='unavailable'||e.code==='not_granted'))toast('التصدير غير متاح في هذا العرض.','err');else toast('تعذّر التصدير. حاول مرة أخرى.','err');}
}

function exRange(){
  const k=S.ui.exR||'30',t=todayStr(),d=parseYmd(t);let a,e;
  if(k==='month'){a=ymd(new Date(d.getFullYear(),d.getMonth(),1));e=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));}
  else if(k==='prev'){a=ymd(new Date(d.getFullYear(),d.getMonth()-1,1));e=ymd(new Date(d.getFullYear(),d.getMonth(),0));}
  else{a=addDays(t,-(+k-1));e=t;}
  const len=daysBetween(a,e)+1;
  return {s:a,e,len,ps:addDays(a,-len),pe:addDays(a,-1)};
}
function ensureRange(a,e){
  if(!S.db||!S.windowFull)return;const key='r:'+a+':'+e;if(S.extra[key])return;
  const last=S.bookings[S.bookings.length-1];if(!last||a>=last.date)return;
  S.extra[key]=[];
  S.db.collection('bookings').where('date','>=',a).where('date','<=',e).limit(1000).get().then(q=>{S.extra[key]=q.docs.map(x=>Object.assign({id:x.id},x.data()));renderAll();}).catch(()=>{delete S.extra[key];});
}
const attended=b=>!!(b.arrivedAt||b.actualReceivedAt)||['arrived','received','ready','delivered'].includes(b.status);
function exMetrics(list,today){
  const past=list.filter(b=>b.date<=today);
  const att=past.filter(attended).length,ns=past.filter(b=>b.status==='noshow').length;
  const del=list.filter(b=>b.status==='delivered'||b.actualDeliveredAt);
  const planned=del.filter(b=>b.actualDeliveredAt&&b.deliveryDate);
  const onTime=planned.filter(b=>{const d=parseYmd(b.deliveryDate);if(b.deliveryTime){const p=b.deliveryTime.split(':').map(Number);d.setHours(p[0],p[1],59);}else d.setHours(23,59,59);return new Date(b.actualDeliveredAt)<=d;}).length;
  const durs=del.filter(b=>b.actualReceivedAt&&b.actualDeliveredAt).map(b=>(new Date(b.actualDeliveredAt)-new Date(b.actualReceivedAt))/36e5).filter(h=>h>=0&&h<1440);
  return {total:list.length,attended:att,noshow:ns,attRate:att+ns?att/(att+ns):null,delivered:del.length,onTimeRate:planned.length?onTime/planned.length:null,
    avgH:durs.length?durs.reduce((x,y)=>x+y,0)/durs.length:null,postponed:list.filter(b=>(b.postponeCount||0)>0||b.noDate).length,cancelled:list.filter(b=>b.status==='cancelled').length,

function stackSVG(W){
  const D=S.exDays||[];if(!D.length)return '';
  const H=236,pt=14,pb=28,pr=34,pl=4,pw=Math.max(120,W-pr-pl),ph=H-pt-pb;
  const max=Math.max(1,...D.map(x=>x.total)),step=niceStep(max),top=Math.ceil(max/step)*step;
  const y=v=>pt+ph-(v/top*ph),band=pw/D.length,bw=Math.max(2,Math.min(24,band*0.62)),today=todayStr();
  let g='';
  for(let v=0;v<=top;v+=step){const yy=Math.round(y(v))+.5;g+=`<line x1="${pl}" x2="${pl+pw}" y1="${yy}" y2="${yy}" class="${v?'gl':'bl'}"/><text x="${pl+pw+6}" y="${yy+4}" class="tk">${v}</text>`;}
  const every=Math.max(1,Math.ceil(D.length/Math.max(1,Math.floor(pw/30))));
  D.forEach((x,i)=>{
    const xc=pl+pw-band*(i+0.5),x0=xc-bw/2;let acc=0;const segs=[];
    x.parts.forEach((v,j)=>{if(v)segs.push([j,v]);});

      const yb=y(acc)-(acc?2:0),yt=y(acc+v);acc+=v;const h=yb-yt;if(h<=0.5)return;

      else g+=`<rect class="${cls}" x="${x0.toFixed(1)}" y="${yt.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"/>`;
    });
    if(i%every===0||x.d===today)g+=`<text x="${xc.toFixed(1)}" y="${H-9}" text-anchor="middle" class="xl${x.d===today?' today':''}">${parseYmd(x.d).getDate()}</text>`;
    g+=`<rect class="hit" x="${(xc-band/2).toFixed(1)}" y="${pt}" width="${band.toFixed(1)}" height="${ph}" data-tipi="${i}"/>`;
  });
  return `<svg class="ex-svg" viewBox="0 0 ${pl+pw+pr} ${H}" role="img" aria-label="الحجوزات يوميًا حسب النتيجة">${g}</svg>`;
}

  if(action){const b=document.createElement('button');b.type='button';b.textContent=action.label;b.onclick=()=>{t.remove();action.fn();};t.appendChild(b);}

      if(t.dataset&&t.dataset.bind){let v=t.type==='checkbox'?t.checked:t.value;const k=t.dataset.kind;if(k==='num')v=Number(v);if(k==='list')v=String(v).split(/[،,]/).map(x=>x.trim()).filter(Boolean);
        setPath(S.ui.set.draft,t.dataset.bind,v);if(t.dataset.rerender)renderSettings();}
    }
  });
  $('#modal').addEventListener('change',async e=>{
    const t=e.target;
    if(t.matches('[data-member-role]')){const id=t.getAttribute('data-member-role'),role=t.value;if(!role)return;
      const ok=await write(()=>S.db.doc('members/'+id).set({role,addedBy:S.me.id||null,addedAt:new Date().toISOString()}),'admin');
      if(ok)toast('تم تحديد الدور: '+nameOf(id)+' — '+cfg().roles[role].name);}
  });
  $('#modal').addEventListener('focusin',e=>{if(e.target.id==='userSearch'&&!e.target.value)runUserSearch('');});
  $('#modal').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sCarNew'){e.preventDefault();settingsAct('addCar');}});
  $('#drawer').addEventListener('input',e=>{if(e.target.id==='waText'){const a=$('#waLink'),b=findB(S.ui.openId);if(a&&b)a.href=waUrl(waNum(b.phone),e.target.value);return;}if(e.target.id==='pWO'){const b=findB(S.ui.openId);if(!b)return;const wo=e.target.value.trim();const w=$('#rptWrap');if(w)w.hidden=!wo&&!getRpt(b).length;const btn=$('#rcvBtn');if(btn){btn.textContent=rcvLabel(b,wo);btn.disabled=b.status==='arrived'&&!wo;}}});
  $('#drawer').addEventListener('change',e=>{if(e.target.name==='pMode'){const r=$('#pDateRow');if(r)r.hidden=e.target.value==='nodate';return;}if(e.target.id==='pDate'){const h=$('#pDateHint');const d=e.target.value;const b=findB(S.ui.openId);if(h&&d&&b)h.innerHTML=deptHintHTML(d,deptsOf(b),b.id);}});

  document.addEventListener('click',async e=>{
    if(!e.target.closest('.ms'))closeMs();
    const t=e.target.closest('[data-ms-more],[data-ex-r],[data-ex-table],[data-wa],[data-wa-tpl],[data-wa-open],[data-wa-copy],[data-view-img],[data-dl],[data-rm-file],[data-view],[data-ms-toggle],[data-goto-day],[data-approve],[data-open-reject],[data-dash-len],[data-dash-shift],[data-dash-today],[data-quick],[data-open],[data-close],[data-act],[data-panel-ok],[data-panel-cancel],[data-copy],[data-day],[data-stat],[data-edit],[data-del],[data-del-ok],[data-del-cancel],[data-set-tab],[data-set-act],[data-set-save],[data-member-del],[data-goto],[data-new]');
    if(!t)return;
    const ds=t.dataset;
    if(ds.view){setView(ds.view);return;}
    if(ds.msToggle){const box=$('#'+ds.msToggle),pop=box.querySelector('.ms-pop');const open=pop.hidden;closeMs(ds.msToggle);if(open&&ds.msToggle==='msTypes')buildTypePop();pop.hidden=!open;t.setAttribute('aria-expanded',open?'true':'false');if(open){updateFormHints();const f=pop.querySelector('input');f&&f.focus();}return;}
    if(ds.gotoDay){S.ui.q='';$('#q').value='';S.ui.date=ds.gotoDay;S.ui.scope='day';S.ui.status='all';S.ui.dept=ds.gotoDept||'all';setView('bookings');return;}
    if(ds.approve){t.disabled=true;const id=ds.approve;const prev=await doAction(id,'approve',{});if(prev)toast(DONE.approve,'',{label:'تراجع',fn:()=>undo(id,prev)});else t.disabled=false;return;}
    if(ds.openReject){openDrawer(ds.openReject);S.ui.act='reject';renderDrawer();setTimeout(()=>{const f=$('#pNote');f&&f.focus();},40);return;}
    if(ds.dashLen){S.ui.dash.len=+ds.dashLen;renderCore();return;}
    if(ds.dashShift){S.ui.dash.start=addDays(S.ui.dash.start,(+ds.dashShift)*S.ui.dash.len);renderCore();return;}
    if(ds.dashToday){S.ui.dash.start=todayStr();renderCore();return;}
    if(ds.msMore){if(S.ui.form){S.ui.form.showAllTypes=true;buildTypePop();}return;}
    if(ds.exR){S.ui.exR=ds.exR;renderCore();return;}
    if(ds.exTable){S.ui.exTable=!S.ui.exTable;renderCore();return;}
    if(ds.wa){e.stopPropagation();const b=findB(ds.wa);if(!b)return;openDrawer(ds.wa);S.ui.waTpl=suggestTpl(b);S.ui.act='wa';renderDrawer();return;}
    if(ds.waTpl){S.ui.waTpl=ds.waTpl;renderDrawer();return;}
    if(ds.waOpen){const id=S.ui.openId,b=findB(id);toast('اتفتحت محادثة واتساب — اضغط «إرسال» هناك.');
      if(b&&S.db){const nowIso=new Date().toISOString();write(()=>S.db.doc('bookings/'+id).update({updatedAt:nowIso,updatedBy:S.me.id||null,history:(b.history||[]).concat([{type:'wa',at:nowIso,by:S.me.id||null,note:ds.waOpen}])}));}
      return;}
    if(ds.waCopy){const ta=$('#waText');if(!ta)return;try{await navigator.clipboard.writeText(ta.value);toast('تم نسخ الرسالة');}catch(_){ta.focus();ta.select();toast('الرسالة متحددة — انسخها يدوي.');}return;}
    if(ds.viewImg){$('#lbImg').src=fileUrl(findFile(ds.viewImg)||{id:ds.viewImg});$('#lightbox').hidden=false;return;}
    if(ds.close==='lightbox'){$('#lightbox').hidden=true;$('#lbImg').removeAttribute('src');return;}
    if(ds.dl){const f=findFile(ds.dl)||{name:'ملف',type:''};
      try{const r=await fetch(fileUrl(findFile(ds.dl)||{id:ds.dl}));if(!r.ok)throw {code:'fetch'};const bl=await r.blob();const ty=f.type||bl.type;const ext=EXT[ty]||'pdf';let nm=(f.name||'ملف').replace(/[\\/:*?"<>|]+/g,'-');if(!new RegExp('\\.'+ext+'$','i').test(nm))nm=nm.replace(/\.[^.]+$/,'')+'.'+ext;
        await S.dl.save({filename:nm,data:bl});}
      catch(er){if(er&&er.code==='declined')return;try{window.open(fileUrl(findFile(ds.dl)||{id:ds.dl}),'_blank','noopener');}catch(_){toast('تعذّر تحميل الملف. جرّب «فتح».','err');}}
      return;}
    if(ds.rmFile){const id=S.ui.openId,b=findB(id);if(!b)return;const key=ds.rmFile+'|'+ds.field;
      if(S.ui.rmArm!==key){S.ui.rmArm=key;renderDrawer();return;}
      S.ui.rmArm=null;const rf=rptField();const fid=ds.field==='__rpt'?(rf?rf.id:null):ds.field;
      const cur=fid?fileList(b,fid):(b.receiptReport||[]);const gone=cur.find(x=>x.id===ds.rmFile);const rest=cur.filter(x=>x.id!==ds.rmFile);
      const nowIso=new Date().toISOString();const upd={updatedAt:nowIso,updatedBy:S.me.id||null,history:(b.history||[]).concat([{type:'file_removed',at:nowIso,by:S.me.id||null,note:gone?gone.name:''}])};
      if(fid)upd.extra={[fid]:rest};else upd.receiptReport=rest;
      const ok=await write(()=>S.db.doc('bookings/'+id).update(upd));
      if(ok){toast('تمت إزالة الملف');if(S.assets)S.assets.delete(ds.rmFile).catch(()=>{});}
      return;}
    if(ds.quick&&ds.panel){e.stopPropagation();const id=ds.id,k=ds.quick;openDrawer(id);S.ui.noDateDef=k==='apolog';S.ui.act=k==='apolog'?'postpone':k;renderDrawer();setTimeout(()=>{const f=$('#drawer .panel #pWO')||$('#drawer .panel #pNote');f&&f.focus();},40);return;}
    if(ds.quick){e.stopPropagation();t.disabled=true;const id=ds.id,k=ds.quick;const prev=await doAction(id,k,{});if(prev){toast(DONE[k],'',{label:'تراجع',fn:()=>undo(id,prev)});}else t.disabled=false;return;}
    if(ds.new){openForm(null);return;}
    if(ds.open){openDrawer(ds.open);return;}
    if(ds.goto){openDrawer(ds.goto);return;}
    if(ds.close==='drawer'){closeDrawer();return;}
    if(ds.close==='modal'){closeModal();return;}
    if(ds.day){S.ui.q='';$('#q').value='';S.ui.date=ds.day;S.ui.scope='day';renderAll();return;}
    if(ds.stat){S.ui.status=ds.stat;renderCore();return;}
    if(ds.act){
      const k=ds.act,id=S.ui.openId;
      if(k==='wa'){const b=findB(S.ui.openId);S.ui.waTpl=b?suggestTpl(b):null;}
      if(['ready','reopen','mfg_on','mfg_off','approve','confirm'].includes(k)){t.disabled=true;const prev=await doAction(id,k,{});if(prev){toast(DONE[k],'',{label:'تراجع',fn:()=>undo(id,prev)});}S.ui.act=null;renderDrawer();return;}
      S.ui.noDateDef=k==='apolog';S.ui.act=k==='apolog'?'postpone':k;S.ui.confirmDel=false;renderDrawer();setTimeout(()=>{const f=$('#drawer .panel #pWO')||$('#drawer .panel #pNote')||$('#drawer .panel input[type=file]');f&&f.focus();},30);return;
    }
    if(ds.panelCancel){S.ui.act=null;renderDrawer();return;}
    if(ds.panelOk){
      const k=ds.panelOk,id=S.ui.openId,note=($('#pNote')&&$('#pNote').value)||'';
      const p={note};
      if(k==='receive'||k==='deliver')p.time=$('#pTime').value;
      if(k==='postpone'){const m=document.querySelector('#drawer input[name="pMode"]:checked');p.noDate=!!(m&&m.value==='nodate');if(!p.noDate){p.date=$('#pDate').value;p.t=$('#pT').value;if(!p.date){toast('اختر التاريخ الجديد.','err');return;}}}
      if(k==='receive'||k==='attach'){
        const b=findB(id);if(!b)return;p.files=$('#pFiles')?[...$('#pFiles').files]:[];
        if(k==='attach'&&!p.files.length){toast('اختر ملفًا أولًا.','err');return;}
        if(k==='receive'){
          const wo=normDigits(($('#pWO')||{}).value||'').trim(),wf=woField();p.wo=wo;
          if(!wo)p.files=[];
          if(b.status==='arrived'&&!wo){toast('اكتب رقم أمر الشغل لتأكيد الاستلام.','err');$('#pWO').focus();return;}
          if(wo&&wf&&wf.type==='number'&&!/^\d+$/.test(wo)){toast('رقم أمر الشغل لازم يكون أرقام فقط.','err');$('#pWO').focus();return;}
          if(wo&&cfg().receiveFlow.requireReport&&!p.files.length&&!getRpt(b).length){toast('أرفق '+rptLabel()+' لتأكيد الاستلام.','err');return;}
        }
      }
      if((k==='cancel'||k==='reject')&&!note.trim()){toast(k==='reject'?'اكتب سبب الرفض.':'اكتب سبب الإلغاء.','err');$('#pNote').focus();return;}
      if(k==='note'&&!note.trim()){toast('اكتب الملاحظة أولًا.','err');return;}
      t.disabled=true;
      if(p.files&&p.files.length){const lbl=t.textContent;t.textContent='جارٍ رفع الملفات…';try{p.uploaded=await uploadFiles(p.files);}catch(er){toast(er.msg||'تعذّر رفع الملفات.','err');t.disabled=false;t.textContent=lbl;return;}}
      const prev=await doAction(id,k,p);
      if(prev){S.ui.act=null;S.ui.noDateDef=false;toast(k==='postpone'&&p.noDate?'تم تحويل الحجز إلى «مؤجل» — بانتظار موعد جديد':k==='receive'&&!p.wo?'تم تسجيل الوصول — الاستلام معلّق لحين كتابة رقم أمر الشغل':DONE[k]);if(k==='postpone'&&S.ui.scope==='day'&&!S.ui.q){/* keep current day so the user sees it left */}renderAll();renderDrawer();}else t.disabled=false;
      return;
    }
    if(ds.copy){const v=ds.copy;try{await navigator.clipboard.writeText(v);toast('تم نسخ الرقم');}catch(_){toast('انسخ الرقم يدويًا: '+v);}return;}
    if(ds.edit){const id=S.ui.openId;openForm(id);return;}
    if(ds.del){S.ui.confirmDel=true;S.ui.act=null;renderDrawer();return;}
    if(ds.delCancel){S.ui.confirmDel=false;renderDrawer();return;}
    if(ds.delOk){const id=S.ui.openId;const ok=await write(()=>S.db.doc('bookings/'+id).delete());if(ok){closeDrawer();toast('تم حذف الحجز');}return;}
    if(ds.setTab){S.ui.set.tab=ds.setTab;renderSettings();return;}
    if(ds.setAct){settingsAct(ds.setAct);return;}
    if(ds.setSave){saveSettings();return;}
    if(ds.memberDel){const id=ds.memberDel;const ok=await write(()=>S.db.doc('members/'+id).delete(),'admin');if(ok)toast('تمت إزالة '+nameOf(id));return;}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!$('#lightbox').hidden){$('#lightbox').hidden=true;return;}if(!$('#modalWrap').hidden){closeModal();return;}if(!$('#drawerWrap').hidden){closeDrawer();return;}}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.row[data-open]')){e.preventDefault();openDrawer(e.target.dataset.open);}
  });
  setInterval(()=>{if(S.state==='ready'){renderCore();}},60000);
  const tipEl=$('#tip');
  const onTip=e=>{
    const h=e.target&&e.target.closest?e.target.closest('[data-tipi],[data-tipt]'):null;
    if(!h||effView()!=='executive'){if(!tipEl.hidden)tipEl.hidden=true;return;}
    tipEl.innerHTML=h.dataset.tipi!=null?tipDay(+h.dataset.tipi):esc(h.dataset.tipt).replace(/\n/g,'<br>');tipEl.hidden=false;
    const r=tipEl.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
    if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;
    tipEl.style.left=Math.max(8,x)+'px';tipEl.style.top=Math.max(8,y)+'px';
  };
  document.addEventListener('pointermove',onTip);document.addEventListener('pointerdown',onTip);
  document.addEventListener('scroll',()=>{if(!tipEl.hidden)tipEl.hidden=true;},{passive:true});
  let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(effView()==='executive')renderExec();},150);});
}
init();
</script>
